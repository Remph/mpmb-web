# Builds the app and uploads it to its folder on remph.de (remph.de/mpmb/) on every push to main.
# Setup and what to do when it fails: "Deploy" in README.md. This repo is public, so its Actions
# minutes are free; pull requests from forks never see the secrets (the workflow doesn't run on them).
name: Deploy to remph.de

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be uploaded or deleted (nothing changes on the server)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The login lives in this environment's secrets, which GitHub hands only to jobs on main (its
    # deployment branch rule). Branches are pushed here by more than one hand, and a workflow on
    # any branch could otherwise read plain repository secrets.
    environment: remph.de
    # Two quick pushes must not upload at the same time.
    concurrency:
      group: deploy-remph-de
      cancel-in-progress: false
    # The actions are pinned to commits (what v4 pointed to on 2026-11-02), so a moved tag can't change
    # what runs next to the FTP login. To update: look up the new tag's commit and change both.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The same checks as before every pull request; a red one stops the upload.
      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm check

      # The build names its commit on the start page and links to that source (src/version.ts).
      - name: Build
        run: pnpm build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          # Pushes upload for real; a manual run is a dry run unless unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: bash scripts/deploy.sh dist
