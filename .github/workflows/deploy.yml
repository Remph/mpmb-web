# Builds the app and uploads it to its folder on remph.de (remph.de/mpmb/) on every push to main.
# Setup and what to do when it fails: "Deploy" in README.md. This repo is public, so its Actions
# minutes are free; pull requests from forks never see the secrets (the workflow doesn't run on them).
name: Deploy to remph.de

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be uploaded or deleted (nothing changes on the server)'
        type: boolean
        default: true

permissions:
  contents: read

# Two quick pushes must not deploy at the same time, nor out of order: the whole run waits for the one before.
concurrency:
  group: deploy-remph-de
  cancel-in-progress: false

jobs:
  # Everything that runs the dependencies' code (install, tests, browser tests, build) runs here, without the FTP
  # login: this job has no environment and so no secrets. It hands on only the built dist/ (security audit
  # 2026-11-20, finding 09).
  build:
    runs-on: ubuntu-24.04
    # An empty MariaDB next to the job for the database tests (pnpm test:db), gone when the job ends. Pinned by
    # digest like the actions below: mariadb:10.11 as of 2026-11-21 (to update: the tag's digest on Docker Hub).
    # The passwords are for this throwaway container only; nothing outside the job can reach it.
    services:
      mariadb:
        image: mariadb@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
        env:
          MARIADB_ROOT_PASSWORD: root-test
        ports:
          - 3306:3306
        # The job's steps start once the database answers (the image's own health check).
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    # The actions are pinned to commits (what the tag pointed to when it was added), so a moved tag can't change
    # what runs. To update: look up the new tag's commit and change every use.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # minimumReleaseAge (pnpm-workspace.yaml) keeps versions out that are less than a day old.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The same checks as before every pull request; a red one stops the upload.
      - name: Test
        run: pnpm test

      # The service's tests on a real database (server/README.md, "Tests"), which `pnpm test` skips: three empty
      # databases, one per test file, and the user tools/test-db.ts expects.
      - name: Database tests
        env:
          TEST_DB_HOST: 127.0.0.1
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          docker exec "$MARIADB_CONTAINER" mariadb -uroot -proot-test -e "
            CREATE DATABASE mpmb_test; CREATE DATABASE mpmb_lager_test; CREATE DATABASE mpmb_app_test;
            CREATE USER 'mpmb'@'%' IDENTIFIED BY 'mpmb-test';
            GRANT ALL ON mpmb_test.* TO 'mpmb'@'%'; GRANT ALL ON mpmb_lager_test.* TO 'mpmb'@'%';
            GRANT ALL ON mpmb_app_test.* TO 'mpmb'@'%';"
          pnpm test:db

      - name: Type check
        run: pnpm check

      # The browser tests (e2e/) are the only ones that run the worker, the page's headers, the pop-ups and
      # the update of saved characters together. They make a test build of their own (playwright.config.ts),
      # so they run before the real build below, which replaces it.
      - name: Install Firefox for the browser tests
        run: pnpm exec playwright install --with-deps firefox

      - name: Browser tests
        run: pnpm e2e

      # The build names its commit on the start page and links to that source (src/version.ts).
      - name: Build
        run: pnpm build

      # include-hidden-files: dist/.htaccess (the headers) starts with a dot, which the action leaves out otherwise.
      - name: Hand the build to the upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The upload: the only job with the FTP login. It runs no dependency code: a fresh checkout for
  # scripts/deploy.sh and the header check (plain Node, no packages), and the build from the job above.
  upload:
    needs: build
    runs-on: ubuntu-24.04
    # The login lives in this environment's secrets, which GitHub hands only to jobs on main (its
    # deployment branch rule). Branches are pushed here by more than one hand, and a workflow on
    # any branch could otherwise read plain repository secrets.
    environment: remph.de
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          # Pushes upload for real; a manual run is a dry run unless unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: bash scripts/deploy.sh dist

      # Node 22 for tools/live-headers.ts (it runs TypeScript directly); no packages are installed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          node-version: 22

      # The live page must send the headers public/.htaccess sets (CSP, COOP, COEP), and a script of the build be there:
      # a red step here means the upload went through but the app is unprotected or broken (README.md, "Deploy").
      - name: Check the live headers
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: node tools/live-headers.ts https://remph.de/mpmb/ dist
