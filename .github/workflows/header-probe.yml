# Temporary: does the live app load in Firefox with the new CSP (#118)? Read-only visits, no secrets.
# Delete with the branch.
name: Header probe
on:
  push:
    branches: [feature/live-header-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Open remph.de/mpmb/ in Firefox
        run: |
          mkdir probe && cd probe && npm init -y >/dev/null && npm install --silent playwright@1.56.1 >/dev/null
          npx playwright install --with-deps firefox >/dev/null
          cat > probe.mjs <<'JS'
          import { firefox } from 'playwright';
          const browser = await firefox.launch();
          const page = await browser.newPage();
          const notes = [];
          page.on('console', (m) => { if (m.type() === 'error' || /Content.Security|CSP/i.test(m.text())) notes.push(`console ${m.type()}: ${m.text()}`); });
          page.on('pageerror', (e) => notes.push(`pageerror: ${e.message}`));
          page.on('requestfailed', (r) => notes.push(`failed: ${r.url()} ${r.failure()?.errorText}`));
          await page.goto('https://remph.de/mpmb/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(3000);
          console.log('crossOriginIsolated:', await page.evaluate(() => crossOriginIsolated));
          console.log('heading:', await page.locator('h1, h2').first().textContent());
          // The engine: a new character starts MPMB's scripts in the worker.
          await page.getByRole('button', { name: /New character|Neuer Charakter/ }).click();
          const apply = page.getByRole('dialog').getByRole('button', { name: /Apply|Übernehmen/ });
          await apply.waitFor({ timeout: 120000 }).then(() => console.log('engine: source selection shown'), () => console.log('engine: no source selection in 120 s'));
          console.log(notes.length ? notes.join('\n') : 'no console errors');
          await browser.close();
          JS
          node probe.mjs
